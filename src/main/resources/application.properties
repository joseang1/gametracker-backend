spring.application.name=gametracker-backend

# Core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}
spring.jpa.open-in-view=false
spring.config.import=optional:file:.env[.properties]

# Base end-points config
api-endpoint=/api/v1

# Security - JWT (HS256). Override JWT_SECRET outside local development.
jwt.secret=${JWT_SECRET:c+OehjMq/Ow3FcvYYajGatoDpK5qmICf6yZcmcX9eWM=}
jwt.expiration-hours=24

# CORS - comma separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Seed users created on first start (only when the users table is empty)
app.seed.admin-password=${ADMIN_PASSWORD:admin1234}
app.seed.demo-password=${DEMO_PASSWORD:demo1234}

# RAWG Video Games Database - https://rawg.io/apidocs
rawg.base-url=https://api.rawg.io/api
rawg.api-key=${RAWG_API_KEY:}
